[project]
name = "iomanager"
version = "0.1.0"
description = "Create python services that do I/O"
readme = "README.md"
authors = [
    { name = "Ron Weisenstern", email = "ron.weisenstern@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
s3 = [
    "aioboto3>=15.5.0",
]
kafka = [
    "aiokafka>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aioboto3>=15.5.0",
    "aiokafka>=0.15.0",
    "black>=26.10.1",
    "ruff>=0.17.6",
    "ty>=0.0.110",
    "types-aioboto3[s3]>=15.5.0",
]
